<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Stash</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-layout">
    <!-- Folder Sidebar -->
    <aside class="folder-sidebar">
      <div class="folder-header">
        <span>Folders</span>
        <button id="newFolderBtn" class="icon-btn" title="New folder">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <ul id="folderList" class="folder-list">
        <li class="folder-item active" data-folder-id="">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
          <span>All</span>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="container">
        <div class="header-row">
          <h1>Stash</h1>
        </div>

        <div class="section">
          <button id="saveBookmarkBtn" class="btn btn-primary w-full">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
              <line x1="12" y1="7" x2="12" y2="13"></line>
              <line x1="9" y1="10" x2="15" y2="10"></line>
            </svg>
            Save This Page
          </button>
        </div>

        <div class="section">
          <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchQuery" placeholder="Search by meaning..." class="search-input">
            <div id="autocompleteList" class="autocomplete-list hidden"></div>
          </div>
        </div>

        <div class="stats">
          <span id="bookmarkCount">0 bookmarks</span>
          <span class="dot">&#8226;</span>
          <span id="bookmarkLimit" class="muted">1000 max</span>
        </div>

        <div id="searchResults" class="bookmark-list">
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
            <p>No bookmarks yet</p>
            <p class="muted">Save pages to search them by meaning</p>
          </div>
        </div>

        <div id="recentSection" class="section hidden">
          <h3 class="section-title">Recent</h3>
          <div id="recentList" class="bookmark-list"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- New folder modal -->
  <div id="folderModal" class="modal hidden">
    <div class="modal-content">
      <h3>New Folder</h3>
      <input type="text" id="folderNameInput" placeholder="Folder name" class="modal-input" maxlength="50">
      <div class="modal-actions">
        <button id="cancelFolderBtn" class="btn btn-ghost">Cancel</button>
        <button id="createFolderBtn" class="btn btn-primary">Create</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
